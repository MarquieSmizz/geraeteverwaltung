{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmeldung – Geräteverwaltung</title>
    <link rel="stylesheet" href="{% static 'devices/css/style.css' %}">
</head>
<body class="login-page">
    <main class="login-card">
        <header class="login-header">
            <h1>Geräteverwaltung</h1>
            <p>Bitte melden Sie sich an.</p>
        </header>

        {% if form.errors %}
            <div class="login-error" role="alert">
                Benutzername oder Passwort ist ungültig.
            </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <div class="form-field">
                <label for="{{ form.username.id_for_label }}">Benutzername</label>
                {{ form.username }}
            </div>

            <div class="form-field">
                <label for="{{ form.password.id_for_label }}">Passwort</label>
                {{ form.password }}
            </div>

            <button type="submit" class="login-button">Anmelden</button>
        </form>
    </main>
</body>
</html>

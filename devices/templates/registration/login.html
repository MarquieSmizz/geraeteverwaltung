<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Anmeldung</title>
</head>
<body>
    <main>
        <h1>Anmeldung</h1>

        {% if form.errors %}
            <p>Benutzername oder Passwort ist ungültig.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Anmelden</button>
        </form>
    </main>
</body>
</html>
